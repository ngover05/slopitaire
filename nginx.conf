server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Gzip compression for text, scripts, styles, JSON, and SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml;

    # Default security headers (inherited by locations without add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Lightweight container healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry HTML: always revalidate so updates appear immediately
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Companion PNG sprites: cache for 7 days
    # (Cache-Control is set by hand rather than with `expires`, which would add a second Cache-Control header)
    location ^~ /images/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Prerecorded voice clips: content-addressed (?v= changes when a voice is re-rendered), cache for 30 days
    location ^~ /audio/ {
        types { audio/mpeg mp3; audio/ogg opus ogg; }   # stock mime.types has no .opus
        default_type audio/mpeg;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Any standalone MP3 assets outside /audio/
    location ~* \.mp3$ {
        default_type audio/mpeg;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Stylesheets and scripts: always revalidate (cheap 304s via ETag). index.html loads them without a version
    # query, so caching them for a fixed time would pair a fresh index.html with stale scripts after a deploy.
    location ~* ^/(css|js)/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Backend API & Google OAuth2 reverse proxy
    # The upstream is resolved per request through Docker's embedded DNS instead of once at startup, so nginx
    # still starts when no `api` container exists (standalone `docker run`, guest-only play; /api answers 502),
    # and keeps working when the api container is recreated with a new IP.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA / static fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
