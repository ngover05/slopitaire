services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: slopitaire-api:latest
    container_name: slopitaire-api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      SQLITE_PATH: /data/slopitaire.db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - slopitaire-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  slopitaire:
    build:
      context: .
      dockerfile: Dockerfile
    image: slopitaire:latest
    container_name: slopitaire
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  slopitaire-data:
